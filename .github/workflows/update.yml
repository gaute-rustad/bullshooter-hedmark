name: Oppdater Hedmark C Dartliga

on:
  schedule:
    # Torsdager: Hver time fra kl. 15:00 til 24:00 (midnatt) norsk tid (14:00-23:00 UTC)
    - cron: '0 14-23 * * 4'
    # Fredager: Kl. 08:00 norsk tid (07:00 UTC)
    - cron: '0 7 * * 5'
  workflow_dispatch: # Gir deg en manuell "Run workflow"-knapp i GitHub
    inputs:
      force_notify:
        description: 'Send ntfy-varsel uansett endring? (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Sjekk ut repository
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer avhengigheter
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests

      - name: Kjør scraper
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GH_PAGES_URL: ${{ secrets.GH_PAGES_URL }}
          FORCE_NOTIFY: ${{ github.event.inputs.force_notify || 'false' }}
        run: |
          python scraper.py

      - name: Sjekk for endringer og push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json data.js weekly_summary.txt
          if git diff --staged --quiet; then
            echo "Ingen nye data funnet. Avslutter uten commit."
          else
            git commit -m "Auto-oppdatering: Nye resultater for Hedmark C [skip ci]"
            git push
            echo "Push fullført!"
          fi
